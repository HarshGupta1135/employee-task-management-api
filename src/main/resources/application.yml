# Default profile: zero-setup local run (in-memory H2 database + in-memory cache).
# Activate the "postgres" and/or "redis" profiles to use real infrastructure (see docker-compose.yml).
spring:
  application:
    name: task-manager

  datasource:
    url: jdbc:h2:mem:taskdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only verifies that entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Lets the app start against a database that was initialised manually from database/schema.sql.
    baseline-on-migrate: true

  h2:
    console:
      enabled: true
      path: /h2-console

  cache:
    type: simple

  data:
    web:
      pageable:
        default-page-size: 10
        max-page-size: 100
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      connect-timeout: 2s

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    redis:
      enabled: false

springdoc:
  # Set SWAGGER_ENABLED=false to hide the API documentation in production.
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    persist-authorization: true
  default-produces-media-type: application/json

app:
  jwt:
    # Base64-encoded HMAC-SHA key (at least 256 bits). Override with the JWT_SECRET environment variable outside local development.
    secret: ${JWT_SECRET:dGFzay1tYW5hZ2VyLWxvY2FsLWRldmVsb3BtZW50LXNlY3JldC1rZXktY2hhbmdlLW1lLWluLXByb2R1Y3Rpb24=}
    expiration: ${JWT_EXPIRATION:PT1H}
    issuer: task-manager-api
  cache:
    task-list-ttl: ${TASK_LIST_CACHE_TTL:PT10M}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  seed:
    enabled: ${APP_SEED_ENABLED:true}
    admin-email: ${APP_ADMIN_EMAIL:admin@taskmanager.com}
    admin-password: ${APP_ADMIN_PASSWORD:Admin@123}
    user-password: ${APP_DEMO_USER_PASSWORD:User@1234}

logging:
  level:
    com.harsh.taskmanager: INFO
